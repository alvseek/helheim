[project]
name = "helheim"
version = "0.1.0"
description = "A local dashboard for calling cloud MCP tools and reading what comes back"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "procedure-composer==0.2.0",
    "pydantic>=2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "mcp>=1.2",
    "tiktoken>=0.14,<0.15",
    "authlib>=1.6,<2",
]

[project.scripts]
helheim = "helheim.__main__:main"

[tool.uv.sources]
# Pin the installed renderer independently of the source branch being edited.
procedure-composer = { git = "https://github.com/alvseek/agent-memory-system.git", rev = "669553c7986b2082316c2ef03d2d7c6cff3c9e2e", subdirectory = "packages/procedure-composer" }

[dependency-groups]
dev = [
    "cryptography>=44,<51",
    "pyjwt>=2.10,<3",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helheim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: reaches a real MCP server and needs a stored token",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
