[project]
name = "helheim"
version = "0.1.0"
description = "A local dashboard for calling cloud MCP tools and reading what comes back"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "mcp>=1.2",
]

[project.scripts]
helheim = "helheim.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helheim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: reaches a real MCP server and needs a stored token",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
